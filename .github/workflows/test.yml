```yaml
name: Terraform Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for GitHub OIDC
permissions:
  id-token: write
  contents: read

jobs:

  # =========================
  # PLAN
  # =========================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Configure AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<AWS_ACCOUNT_ID>:role/GitHubActionsTerraformRole
          aws-region: us-east-1

      # 4. Verify AWS connection
      - name: Check AWS Identity
        run: aws sts get-caller-identity

      # 5. Terraform Init
      - name: Terraform Init
        run: terraform init

      # 6. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 7. Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # 8. Upload Terraform Plan
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan


  # =========================
  # APPLY
  # =========================
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: plan

    # GitHub Environment
    # Configure this environment with Required Reviewers
    environment: production

    steps:

      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Configure AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590184067731:role/rrffggg
          aws-region: us-east-1

      # 4. Verify AWS connection
      - name: Check AWS Identity
        run: aws sts get-caller-identity

      # 5. Terraform Init
      - name: Terraform Init
        run: terraform init

      # 6. Download Plan
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      # 7. Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
```
